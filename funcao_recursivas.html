<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio de funções recursivas</title>
</head>
<body>
    <div id="output"></div>
    <script>
        opcao = 0

        function tabuada() {

            multiplicador = parseInt(leia("Digite um número da tabuada."));
            resultado = "<h3>Tabuada do " + multiplicador + ":</h3>";
            inicio_tab = 1;
            fim_tab = 10;

            function calculo(inicio_tab, fim_tab, multiplicador){
                if (inicio_tab > fim_tab) {
                    return;
                } 
                document.write(inicio_tab + " X " + multiplicador + " = " + (inicio_tab * multiplicador) + "<br>")    
            
                tabuada(inicio_tab + 1, fim_tab, multiplicador)

            }
            resultado += "<hr>";
            document.getElementById("output").innerHTML += resultado;
        }
        
        
        function media() {
                        
            nome = prompt("Digite a Nome do(a) Aluno(a).");
            quantidade = parseInt(prompt("Digite quantas notas para o "+ nome+". Voce vai digitar?."));
            notas=[];
            calcula(quantidade, 1);

            function calcula(quantidade,i ){
                notas.push(Number(prompt("Digite a nota "+ i +" do(a) "+ nome+" :")))
                if (i >= quantidade) {
                    return;
                }
                calcula(quantidade, i+1 )
            }

            soma = notas.reduce((a,b)=> a +b, 0);
            media = soma / notas.length;

            document.write("<h3>Média dos alunos:</h3> A média é " + media + "<hr>");
        }



        function leia(mgs) {
            return prompt(mgs);
        }
        function mostre(mgs) {
            //document.write(mgs);
            alert(mgs);
        }
        function sair() {
            opcao = 3;
            mostre("Obrigado por utilizar o programa.");
        }

        function menu(opcao) {
            opcao = parseInt(prompt("digite uma das opções abaixo:\n1 - Tabuada.\n2 - Media\n3 - Sair"));

            switch (opcao) {
                case 1:
                    tabuada();
                    break;
                case 2:
                    media();
                    break;
                case 3:
                    sair();
                    return
                    break;                            
                default:
                    mostre("Digite uma opção válida.");
                    break;
            } 
            
            menu();
        }

    </script>
    
</body>
</html>
